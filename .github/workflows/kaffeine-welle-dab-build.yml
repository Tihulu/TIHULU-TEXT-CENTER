name: Pinned welle.io DAB+ loopback receiver build

on:
  push:
    branches:
      - architecture/kaffeine-core-tv-2026-11-07
    paths:
      - kaffeine_next/install_welle.sh
      - kaffeine_next/install.sh
      - kaffeine_next/media_install_guard.py
      - kaffeine_next/native_radio_tab.h
      - kaffeine_next/patch_upstream.py
      - .github/workflows/kaffeine-welle-dab-build.yml
  pull_request:
    paths:
      - kaffeine_next/install_welle.sh
      - kaffeine_next/install.sh
      - kaffeine_next/media_install_guard.py
      - kaffeine_next/native_radio_tab.h
      - kaffeine_next/patch_upstream.py
      - .github/workflows/kaffeine-welle-dab-build.yml
  workflow_dispatch:

jobs:
  dab-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned GPL welle-cli with private loopback control socket
        run: bash kaffeine_next/install_welle.sh
      - name: Smoke-test executable and source-address policy
        run: |
          test -x "$HOME/.local/opt/tihulu-media-center-welle/bin/welle-cli"
          test -f "$HOME/.local/opt/tihulu-media-center-welle/.tihulu-loopback-welle-revision"
          "$HOME/.local/opt/tihulu-media-center-welle/bin/welle-cli" --help > /tmp/welle-help.txt 2>&1 || true
          grep -E "welle-cli|Receive|RTL|channel" /tmp/welle-help.txt | head -12
          grep -q 'htonl(INADDR_LOOPBACK)' kaffeine_next/install_welle.sh
          if grep -q 'INADDR_ANY' "$HOME/.local/opt/tihulu-media-center-welle/.tihulu-loopback-welle-revision"; then exit 1; fi
          echo 'Pinned local radio receiver binary built; real antenna not connected in CI.'
