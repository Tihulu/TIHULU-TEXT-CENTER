name: RF Geolocation Center
on:
  push:
    paths:
      - 'rf_geolocation_center/**'
      - '.github/workflows/rf-geolocation.yml'
  pull_request:
    paths:
      - 'rf_geolocation_center/**'
      - '.github/workflows/rf-geolocation.yml'
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GNSS and positioning tests
        run: node --test rf_geolocation_center/tests/*.test.mjs
      - name: Check browser code syntax
        run: |
          node --check rf_geolocation_center/web/app.mjs
          node --check rf_geolocation_center/web/maps.mjs
          node --check rf_geolocation_center/web/receivers.mjs
          node --check rf_geolocation_center/web/auto_explorer.mjs
          node --check rf_geolocation_center/web/usb_sdr.mjs
          node --check rf_geolocation_center/web/rf_survey.mjs
          node --check rf_geolocation_center/core/rf_ranging.mjs
          node --check rf_geolocation_center/core/source_catalog.mjs
          node --check rf_geolocation_center/web/catalog_discovery.mjs
          node --check rf_geolocation_center/web/simple_ui.mjs
          node --check rf_geolocation_center/core/dvb_scan.mjs
          node --check rf_geolocation_center/core/gnss.mjs
          node --check rf_geolocation_center/core/positioning.mjs
          node --check rf_geolocation_center/sw.js

  native-localhost:
    name: Loopback-only launcher ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify launcher unit and real localhost HTTP smoke tests
        run: python -m unittest discover -s rf_geolocation_center/tests -p 'test_native.py' -v
      - name: Compile optional Python loopback launcher
        run: python -m compileall -q rf_geolocation_center
      - name: Inspect honest native backend diagnostics
        run: python -m rf_geolocation_center doctor
