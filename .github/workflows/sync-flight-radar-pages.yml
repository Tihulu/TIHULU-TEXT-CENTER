name: Publish Browser-only Flight Radar inside TIHULU Applications
# Canonical Flight Radar release source is main; legacy 0.3.1 stays preserved in the source repository.
# Re-sync corrected I/R markers, source checkboxes and information panel spacing across both origins.
# Sync Flight Radar 0.3.2.dev4 Satellite Center-style DE/TR offline location catalog and chooser.
# Canonical source: pinned dev4 preview with local Qt search preference persistence and tar1090 selector.
# Preserve exact canonical source revision for both web deployment endpoints.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-flight-radar-pages.yml
  workflow_dispatch:
  schedule:
    # Poll source every 15 minutes. Cross-repo GITHUB_TOKEN cannot initiate
    # a dispatch without a separately authorized owner token.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: tihulu-flight-radar-pages-sync
  cancel-in-progress: false

jobs:
  sync-flight-radar:
    runs-on: ubuntu-24.04
    steps:
      - name: Get reviewed Flight Radar browser source (public repository)
        uses: actions/checkout@v4
        with:
          repository: Tihulu/tihulu-flight-radar
          # Follow the reviewed single source; do not leave a hard-coded commit
          # pinned after new Flight Radar changes.
          ref: main
          path: flight-radar-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and bundle direct WebUSB driver at CI time
        run: |
          cd flight-radar-source
          bash scripts/build-browser-assets.sh
          node --check tihulu_flight_radar/web/multi_sources.js
          node --check tihulu_flight_radar/web/flight_location_ui.mjs
          node --check tihulu_flight_radar/web/location_search.mjs
          test -s tihulu_flight_radar/web/install.html
          node --check tihulu_flight_radar/web/app.js
          # Regression gate: public Pages must start genuine Internet aircraft without USB.
          grep -q 'const startPagesInternet=' tihulu_flight_radar/web/app.js
          node --check tihulu_flight_radar/web/browser_usb.mjs
          node --check tihulu_flight_radar/web/adsb_worker.mjs
          node --check tihulu_flight_radar/web/tar1090-adapter.js
          node --test tests/web_bridge.test.cjs tests/pages_tar.test.cjs tests/browser_adsb.test.cjs tests/browser_source.test.cjs tests/aircraft_visuals.test.cjs tests/webusb_sampleblock.test.cjs tests/internet_sources.test.cjs tests/multi_sources.test.cjs tests/tar_layers_regression.test.cjs tests/location_selector.test.cjs tests/release_main.test.cjs tests/tar_full_browser.test.cjs
      - name: Stamp canonical source SHA, identical to standalone Flight Radar
        run: |
          set -euo pipefail
          sha="$(git -C flight-radar-source rev-parse HEAD)"
          printf '{"repo":"Tihulu/tihulu-flight-radar","source_ref":"main","source_sha":"%s"}\n' "$sha" > flight-radar-source/tihulu_flight_radar/web/source-revision.json
          echo "Canonical Flight Radar SHA: $sha"
      - name: Bundle original full tar1090 UI and aircraft metadata
        run: cd flight-radar-source && bash scripts/build-web-tar1090.sh
      - name: Checkout existing live GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true
      - name: Publish versioned browser assets without disturbing Satellite Center
        run: |
          set -euo pipefail
          mkdir -p pages/flight_radar
          rsync -a --delete flight-radar-source/tihulu_flight_radar/web/ pages/flight_radar/
          test -s pages/flight_radar/vendor/rtlsdr.mjs
          test -s pages/flight_radar/multi_sources.js
          test -s pages/flight_radar/flight_location_ui.mjs
          test -s pages/flight_radar/location_search.mjs
          test -s pages/flight_radar/cities-de-tr.json
          test -s pages/flight_radar/CITY_DATA_LICENSE.md
          test -s pages/flight_radar/adsb_worker.mjs
          test -s pages/flight_radar/index.html
          test -s pages/flight_radar/install.html
          test -s pages/flight_radar/tar1090/index.html
          test -s pages/flight_radar/tar1090/tihulu-browser-bridge.js
          grep -q 'tihulu-browser-bridge.js' pages/flight_radar/tar1090/index.html
          grep -q 'id="selected_photo"' pages/flight_radar/tar1090/index.html
          grep -q 'id="selected_infoblock"' pages/flight_radar/tar1090/index.html
          grep -q 'id="fullTar1090"' pages/flight_radar/index.html
          test -s pages/flight_radar/tar1090/UPSTREAM-GPL-LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          base = Path("pages/flight_radar")
          assert json.loads((base / "source-revision.json").read_text())["source_sha"]
          for file in ["operators.js", "icao_aircraft_types2.js"]:
              data = (base / "tar1090/db2" / file).read_bytes()
              assert data and not data.startswith(bytes([0x1f, 0x8b])), file
              assert isinstance(json.loads(data), dict), file
          print("Verified full tar1090 metadata is valid static JSON, not compressed data.")
          PY
          test -s pages/flight_radar/source-revision.json
          python3 -m json.tool pages/flight_radar/source-revision.json >/dev/null
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flight_radar/
          if git diff --cached --quiet; then
            echo 'Flight Radar already published at current source version.'
          else
            git commit -m 'publish: browser-only Flight Radar WebUSB into existing Pages site'
            git push origin HEAD:gh-pages
          fi
          echo 'TEXT CENTER target: https://tihulu.github.io/TIHULU-TEXT-CENTER/flight_radar/'
          echo 'Standalone target: https://tihulu.github.io/tihulu-flight-radar/'
          echo 'Both Pages must serve matching source-revision.json source_sha values.'
