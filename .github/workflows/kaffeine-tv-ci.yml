name: TIHULU Kaffeine DVB source build

on:
  push:
    branches:
      - architecture/kaffeine-core-tv-2026-11-07
    paths:
      - 'kaffeine_next/**'
      - 'tv_center/__main__.py'
      - 'tv_center/packaging/build-deb.sh'
      - 'tests/test_tv_kaffeine.py'
      - '.github/workflows/kaffeine-tv-ci.yml'
  pull_request:
    paths:
      - 'kaffeine_next/**'
      - 'tv_center/__main__.py'
      - 'tv_center/packaging/build-deb.sh'
  workflow_dispatch:

jobs:
  kaffeine-qt5-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and no-hardware checks
        run: |
          python3 -m compileall -q kaffeine_next tv_center
          python3 -m unittest discover -s tests -p test_tv_kaffeine.py -v
          bash -n kaffeine_next/install.sh
      - name: Install KDE Kaffeine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make pkg-config extra-cmake-modules \
            qtbase5-dev libqt5x11extras5-dev libkf5coreaddons-dev \
            libkf5dbusaddons-dev libkf5i18n-dev libkf5kio-dev \
            libkf5solid-dev libkf5widgetsaddons-dev \
            libkf5windowsystem-dev libkf5xmlgui-dev \
            libvlc-dev libx11-dev libxss-dev libdvbv5-dev \
            libudev-dev libqt5sql5-sqlite
      - name: Fetch GPL upstream Kaffeine at verified immutable revision
        run: |
          git clone --depth 1 --branch v2.0.19 https://github.com/KDE/kaffeine.git "$RUNNER_TEMP/kaffeine"
          test "$(git -C "$RUNNER_TEMP/kaffeine" rev-parse HEAD)" = e7ea15b86dafed3b20b151cbcb080578ab8e2d5c
          python3 kaffeine_next/patch_upstream.py "$RUNNER_TEMP/kaffeine"
          git -C "$RUNNER_TEMP/kaffeine" diff --check
      - name: Configure and compile patched Kaffeine DVB host
        run: |
          cmake -S "$RUNNER_TEMP/kaffeine" -B "$RUNNER_TEMP/build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          test -x "$RUNNER_TEMP/build/src/kaffeine"
      - name: Package Python AI companion without DVB hardware
        run: |
          bash tv_center/packaging/build-deb.sh "$RUNNER_TEMP/packages"
          dpkg-deb --info "$RUNNER_TEMP/packages/tihulu-tv-center_0.1.0~dev1_all.deb"
