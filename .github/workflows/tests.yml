name: Text Center tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit and loopback HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Check JS syntax
        run: node --check web/app.js
      - name: Verify Satellite Center IQ engine and audio preview (pure Node)
        run: |
          node --check satellite_center/browser/iq_intelligence.mjs
          node --check satellite_center/browser/iq_analysis_ui.mjs
          node --test tests/test_satellite_iq_analysis.mjs tests/test_satellite_iq_intelligence.mjs
      - name: Verify no Python third-party dependencies
        run: python -m compileall -q textcenter tests
